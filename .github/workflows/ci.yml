name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Windows-only: the app targets net10.0-windows and uses WinForms.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KsGameLauncher.sln

      - name: Build
        # The deprecated .NET Framework KsGameLauncher project is excluded from
        # the solution's default build configuration, so this builds
        # KsGameLauncher2 and its test project only.
        run: dotnet build KsGameLauncher.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/KsGameLauncher2.Tests/KsGameLauncher2.Tests.csproj --configuration Release --no-build --verbosity normal
